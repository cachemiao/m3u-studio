name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.3.4'
        required: true
        type: string
      update_latest:
        description: 'Also update the latest image tag'
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: cachemiao/m3u-studio
      GHCR_IMAGE: ghcr.io/cachemiao/m3u-studio
    steps:
      - name: Validate version and credentials
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          UPDATE_LATEST: ${{ github.event_name == 'release' || inputs.update_latest }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable version tag such as v0.3.5.'
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Add the DOCKERHUB_TOKEN repository Actions secret first.'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$version"
            echo "$GHCR_IMAGE:$version"
            if [[ "$UPDATE_LATEST" == 'true' ]]; then
              echo "$IMAGE:latest"
              echo "$GHCR_IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run application tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q
          node --test tests/*.cjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: cachemiao
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=M3U Studio
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/cachemiao/m3u-studio
            org.opencontainers.image.licenses=GPL-2.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image
        env:
          TAGS: ${{ steps.version.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Docker Hub and GHCR images published'
            echo '```text'
            echo "$TAGS"
            echo "$DIGEST"
            echo '```'
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
